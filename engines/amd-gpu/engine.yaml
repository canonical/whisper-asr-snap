name: amd-gpu
summary: ROCm-optimized for workstation GPUs
description: |
  This engine uses WhisperLive with the ROCm backend.

  It is optimized for AMD GPUs.
  
  This engine supports only the amd64 CPU architecture.

  It supports the following AMD GPU microarchitectures:
  - gfx1030
  - gfx1100
  - gfx1101
  - gfx1102
  - gfx1150
  - gfx1151
  - gfx1200
  - gfx1201

vendor: Canonical Ltd

devices:
  allof:
    - type: cpu
      architecture: amd64
  anyof:
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1030
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1100
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1101
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1102
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1150
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1151
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1200
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1201

runtime: whisper-live-rocm

model:
  default: faster-whisper-base
  options:
    - faster-whisper-base
    - faster-whisper-small

configurations:
  whisper-live.ws.port: 8351
  whisper-live.ws.host: localhost
  transcription-language: system
