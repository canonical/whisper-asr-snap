name: nvidia-gpu
summary: CUDA optimized for workstation GPUs
description: |
  This engine uses WhisperLive with the CUDA backend.
  
  It is optimized for NVIDIA GPUs.
  
  This engine supports both amd64 and arm64 CPU architectures.
vendor: Canonical Ltd

devices:
  allof:
    - type: gpu
      vendor-id: 0x10de # Nvidia Corporation
  anyof:
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64


runtime: whisper-live

model:
  default: faster-whisper-base
  options:
    - faster-whisper-base
    - faster-whisper-small

configurations:
  whisper-live.ws.port: 8351
  whisper-live.ws.host: localhost
  transcription-language: system
