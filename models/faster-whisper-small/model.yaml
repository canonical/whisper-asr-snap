name: faster-whisper-small

# Alias is used for WhisperLive model identification; 
# Must be one of the WhisperLive's accepted model name
#  e.g. tiny, base, small, large...
alias: small 

description: OpenAI's Whisper-Small model weights translated to the CTranslate2 format. This model is designed for speech recognition tasks and provides a balance between accuracy and computational efficiency.
model-card-url: https://huggingface.co/Systran/faster-whisper-small
quantization: FP16

disk-size: 490M

capabilities:
  - stt

components:
  - model-faster-whisper-small

environment:
  - MODEL_DIR=$SNAP_COMPONENTS/model-faster-whisper-small/
  - MODEL_NAME=faster-whisper-small
