name: whisper-live-openvino

servers:
  openai:
    protocol: http
    base-path: /v1
  openai-unix:
    protocol: http+unix
    base-path: /v1
  whisper-live:
    protocol: ws
    base-path: /
    namespace: whisper-live

environment:
  # Export the server run script path
  - SERVER_RUN_SCRIPT=$SNAP_COMPONENTS/whisper-live/bin/whisper-live-server.py
  # Add the component's packages to PYTHONPATH
  - PYTHONPATH=$PYTHONPATH:$SNAP_COMPONENTS/whisper-live/lib/python3.12/site-packages
  - PYTHONPATH=$PYTHONPATH:$SNAP_COMPONENTS/whisper-live/lib64/python3.12/site-packages
  - PYTHONPATH=$PYTHONPATH:$SNAP_COMPONENTS/whisper-live-openvino/site-packages
  - PYTHONPATH=$PYTHONPATH:$SNAP_COMPONENTS/whisper-live-cpu/site-packages
  # Add component's binaries
  - PATH=$PATH:$SNAP_COMPONENTS/whisper-live/bin
  - PATH=$PATH:$SNAP_COMPONENTS/whisper-live-openvino/usr/bin
  # Add component's shared libraries
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live/lib
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live/usr/lib/$ARCH_TRIPLET
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live-openvino/lib
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live-openvino/usr/lib/$ARCH_TRIPLET
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live-openvino/usr/local/lib
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live-rocm/site-packages/openvino/libs
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live-cpu/lib
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live-cpu/usr/lib/$ARCH_TRIPLET

components:
  - whisper-live
  - whisper-live-cpu # reuses CPU pytorch and CTranslate2
  - whisper-live-openvino
