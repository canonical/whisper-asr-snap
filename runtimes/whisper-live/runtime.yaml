name: whisper-live

servers:
  openai:
    protocol: http # TODO: it's actually websocket
    base-path: /ws
  whisperlive:
    protocol: http # TODO: change to ws
    base-path: /ws

environment:
  # Export the server run script path
  - SERVER_RUN_SCRIPT=$SNAP_COMPONENTS/whisper-live/bin/whisperlive_server.py
  # Add the component's packages to PYTHONPATH
  - PYTHONPATH=$PYTHONPATH:$SNAP_COMPONENTS/whisper-live/lib/python3.12/site-packages
  - PYTHONPATH=$PYTHONPATH:$SNAP_COMPONENTS/whisper-live/lib64/python3.12/site-packages
  # Add component's binaries
  - PATH=$PATH:$SNAP_COMPONENTS/whisper-live/bin
  # Add component's shared libraries
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live/lib
  # Add component's shared libraries
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/whisper-live/usr/lib/$ARCH_TRIPLET

components:
  - whisper-live
